spring.application.name=job-analyzer

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_analyzer?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=${app.resume.max-file-size:10MB}
spring.servlet.multipart.max-request-size=${RESUME_MAX_REQUEST_SIZE:11MB}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.resume.storage-dir=${RESUME_STORAGE_DIR:./data/resumes}
app.resume.max-file-size=${RESUME_MAX_FILE_SIZE:10MB}
app.analysis.provider=${ANALYSIS_PROVIDER:openai}
app.openai.api-key=${LLM_API_KEY:}
app.openai.model=${LLM_MODEL:gpt-4o-mini}
app.openai.chat-completions-url=${OPENAI_CHAT_COMPLETIONS_URL:https://api.openai.com/v1/chat/completions}
app.openai.connect-timeout-seconds=${OPENAI_CONNECT_TIMEOUT_SECONDS:5}
app.openai.read-timeout-seconds=${OPENAI_READ_TIMEOUT_SECONDS:45}

logging.level.root=INFO
logging.level.com.resumeanalyzer=DEBUG
