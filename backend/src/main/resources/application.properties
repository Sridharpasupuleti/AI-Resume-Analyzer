spring.application.name=job-analyzer

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_analyzer?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

logging.level.root=INFO
logging.level.com.resumeanalyzer=DEBUG
